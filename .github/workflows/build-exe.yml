name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name "BOSS_Skill_Timer" `
            --add-data "presets;presets" `
            --clean --noconsole `
            boss_timer.pyw

      - name: Package release
        run: |
          mkdir release
          copy dist\BOSS_Skill_Timer.exe release\
          xcopy /E /I presets release\presets

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOSS_Skill_Timer
          path: release/
